# This file was auto-generated by the Firebase CLI
# https://github.com/firebase/firebase-tools

name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build project
        run: npm run build

      # Los índices van junto a las reglas: sin ellos, las consultas con filtro +
      # orden fallan con `failed-precondition` y la pantalla se queda vacía.
      # En modo no interactivo el CLI solo CREA los que falten; no borra los que
      # existan en el proyecto y no estén en firestore.indexes.json.
      - name: Deploy Firestore rules and indexes
        run: |
          echo '${{ secrets.VIVAI_FIREBASE }}' > "$RUNNER_TEMP/firebase-key.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-key.json"
          npx firebase-tools@13 deploy --only firestore:rules,firestore:indexes --project vivai-now --non-interactive

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.VIVAI_FIREBASE }}
          channelId: live
          projectId: vivai-now
