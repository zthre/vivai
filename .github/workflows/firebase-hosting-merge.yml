# This file was auto-generated by the Firebase CLI
# https://github.com/firebase/firebase-tools

name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build project
        run: npm run build

      # Solo las reglas.
      #
      # Los índices NO se despliegan aquí todavía. Cuando el proyecto tiene algún
      # índice que no está en firestore.indexes.json, el CLI aborta el despliegue
      # entero con «Pass the --force flag to use this command in non-interactive
      # mode» — imprime que los borraría con --force, pero acto seguido pregunta
      # igual, y preguntar en modo no interactivo lanza. No llega a borrar nada,
      # pero tumba el paso y con él el despliegue del hosting.
      #
      # Y --force NO es la salida: borraría de verdad los índices del proyecto que
      # falten en el archivo, y las consultas que dependan de ellos empezarían a
      # fallar con `failed-precondition`.
      #
      # Para reactivarlo: reconciliar el archivo con el proyecto
      # (`npx firebase-tools@13 firestore:indexes --project vivai-now` y añadir lo
      # que falte). Cuando no quede ningún índice por borrar, el CLI ya no pregunta
      # y se puede volver a `--only firestore:rules,firestore:indexes`.
      - name: Deploy Firestore rules
        run: |
          echo '${{ secrets.VIVAI_FIREBASE }}' > "$RUNNER_TEMP/firebase-key.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-key.json"
          npx firebase-tools@13 deploy --only firestore:rules --project vivai-now --non-interactive

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.VIVAI_FIREBASE }}
          channelId: live
          projectId: vivai-now
