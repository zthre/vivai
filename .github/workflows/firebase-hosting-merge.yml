name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build project
        run: npm run build

      # Reglas e índices. Sin los índices, una consulta con filtro + orden falla
      # con `failed-precondition` y la pantalla se queda vacía.
      #
      # Requisito para que esto no tumbe el workflow: firestore.indexes.json tiene
      # que ser un SUPERCONJUNTO de lo que hay en el proyecto. Si al proyecto le
      # sobra alguno, el CLI pregunta si borrarlo — y preguntar en modo no
      # interactivo lanza «Pass the --force flag», abortando el despliegue entero
      # (incluido el hosting) aunque no llegue a borrar nada.
      #
      # NUNCA añadir --force para saltárselo: borraría de verdad esos índices y
      # las consultas que dependan de ellos empezarían a fallar. Lo correcto es
      # reconciliar:
      #   npx firebase-tools@13 firestore:indexes --project vivai-now
      # y añadir al archivo lo que falte.
      - name: Deploy Firestore rules and indexes
        run: |
          echo '${{ secrets.VIVAI_FIREBASE }}' > "$RUNNER_TEMP/firebase-key.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-key.json"
          npx firebase-tools@13 deploy --only firestore:rules,firestore:indexes --project vivai-now --non-interactive

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.VIVAI_FIREBASE }}
          channelId: live
          projectId: vivai-now
